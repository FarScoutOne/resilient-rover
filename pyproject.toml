[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-rover"
version = "0.1.0"
description = "A custom Gymnasium reinforcement learning environment for resilient rover decision-making."
requires-python = ">=3.12"
dependencies = [
    "gymnasium",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["resilient_rover*"]